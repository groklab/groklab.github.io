baseURL: https://groklab.github.io/
title: "真假维斯"
locale: zh-CN
defaultContentLanguage: zh
timeZone: America/Chicago
hasCJKLanguage: true
enableRobotsTXT: true
enableGitInfo: false
disableKinds:
  - taxonomy
  - term

permalinks:
  posts: /posts/:slug/

outputs:
  home:
    - html
    - rss
  section:
    - html

params:
  description: "真假维斯的个人写作。"
  visitor_map:
    # Keep this double latch locked until the Workers Free endpoint is verified.
    enabled: false
    origin: ""

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    renderer:
      unsafe: false
