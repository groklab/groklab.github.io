name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Start with no token privileges. Each job receives only what it needs.
permissions: {}

# A newer commit on the same branch supersedes an older preview or deployment.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.165.0
  HUGO_SHA256: f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20
  HUGO_ENVIRONMENT: production
  TZ: America/Chicago

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Hugo Extended
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "This workflow pins the official linux-amd64 Hugo archive." >&2
            exit 1
          fi

          archive="${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          binary_dir="${RUNNER_TEMP}/hugo-bin"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"

          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            --silent --show-error --tlsv1.2 \
            --output "${archive}" "${url}"
          printf '%s  %s\n' "${HUGO_SHA256}" "${archive}" | sha256sum --check --strict

          mkdir -p "${binary_dir}"
          tar --extract --gzip --file "${archive}" --directory "${binary_dir}" hugo
          chmod 0755 "${binary_dir}/hugo"
          echo "${binary_dir}" >> "${GITHUB_PATH}"

      - name: Verify Hugo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(hugo version)"
          printf '%s\n' "${version}"
          [[ "${version}" == "hugo v${HUGO_VERSION}-"* ]]
          [[ "${version}" == *"+extended "* ]]

      - name: Validate content, math, and responsive images
        run: python3 scripts/check_content.py

      - name: Validate anonymous visitor-map source
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          printf '%s\n' "${node_version}"
          node_major="${node_version#v}"
          node_major="${node_major%%.*}"
          [[ "${node_major}" -ge 20 ]]
          node --test visitor-map/test/*.test.mjs
          python3 visitor-map/tools/check_sqlite.py

      - name: Build production site
        run: >-
          hugo
          --baseURL https://groklab.github.io/
          --cacheDir "${RUNNER_TEMP}/hugo-cache"
          --cleanDestinationDir
          --destination public
          --gc
          --minify
          --panicOnWarning

      - name: Validate production artifact
        run: python3 scripts/check_site.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
