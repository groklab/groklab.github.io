<header class="site-header">
  <div class="brand-lockup">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="真假维斯"><span class="brand__true">真</span><span class="brand__false">假维斯</span></a>
    <span class="brand-tagline" aria-hidden="true"><span class="brand-tagline__true">real</span> <span class="brand-tagline__false">jarvis</span></span>
  </div>
  <nav class="site-nav" aria-label="主要导航">
    <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
    {{- with .Site.GetPage "/posts" }}
      <a href="{{ .RelPermalink }}"{{ if eq $.Section "posts" }} aria-current="page"{{ end }}>文章</a>
    {{- end }}
  </nav>
  <button class="theme-toggle" type="button" data-theme-toggle hidden>
    <span class="theme-toggle__state theme-toggle__state--light" aria-hidden="true">日</span>
    <span class="theme-toggle__state theme-toggle__state--dark" aria-hidden="true">夜</span>
  </button>
</header>
